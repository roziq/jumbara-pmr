<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#c62828">
  <title>Masuk | Jumbara PMR</title><link rel="stylesheet" href="assets/css/styles.css">
  <style>
    body{background:#f5f6f8}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card{width:min(100%,430px);background:#fff;border:1px solid #e9edf0;border-radius:18px;padding:32px;box-shadow:0 18px 55px #2632380d}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.auth-brand .brand-mark{width:44px;height:44px}.auth-card h1{font-size:23px;margin:0 0 8px}.auth-card .muted{margin-bottom:22px}.auth-field{display:grid;gap:7px;margin:15px 0}.auth-field label{font-size:12px;font-weight:700;color:#4d5962}.auth-field input{height:45px;border:1px solid #dce2e6;border-radius:9px;padding:0 12px;font:inherit;font-size:13px;outline:none}.auth-field input:focus{border-color:#c62828;box-shadow:0 0 0 3px #c6282814}.auth-submit{width:100%;height:46px;border:0;border-radius:9px;background:#c62828;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.auth-submit:disabled{opacity:.6;cursor:wait}.auth-switch{width:100%;border:0;background:none;color:#c62828;font-size:12px;font-weight:700;padding:18px 0 0;cursor:pointer}.auth-message{font-size:12px;line-height:1.5;margin-top:14px;color:#277b53}.auth-message[data-type=error]{color:#c62828}.auth-note{font-size:10px;line-height:1.6;color:#87929a;border-top:1px solid #edf0f2;padding-top:14px;margin-top:20px}
  </style>
</head>
<body>
  <main class="auth-wrap"><section class="auth-card">
    <div class="auth-brand"><span class="brand-mark">+</span><span><strong>JUMBARA PMR</strong><small class="muted">PMI Kabupaten Purbalingga</small></span></div>
    <h1 id="authTitle">Masuk ke Jumbara PMR</h1><p class="muted" id="authSubtitle">Gunakan email dan kata sandi akun Anda.</p>
    <form id="authForm">
      <div class="auth-field" id="fullNameField" hidden><label for="fullName">Nama lengkap</label><input id="fullName" name="fullName" autocomplete="name" placeholder="Nama lengkap"></div>
      <div class="auth-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="nama@email.com"></div>
      <div class="auth-field"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Minimal 8 karakter"></div>
      <button class="auth-submit" id="authSubmit" type="submit">Masuk</button>
    </form>
    <button class="auth-switch" id="authModeToggle" type="button">Belum punya akun? Daftar</button>
    <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
    <p class="auth-note">Pendaftaran akun tidak otomatis memberikan hak akses. Administrator harus menetapkan peran pengguna sebelum fitur operasional dapat digunakan.</p>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script>
</body></html>
